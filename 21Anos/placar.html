<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Placar da Gincana - 21 anos Samuel</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#020617,#0f172a,#1e3a8a);
color:white;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
padding:40px;
overflow:hidden;
}

/* GRID */

.container{
display:grid;
grid-template-columns:repeat(8,1fr);
gap:30px;
max-width:1900px;
margin:auto;
align-items:end;
}

/* CARD */

.card{
height:400px;
padding:24px;
border-radius:22px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,0.15);
display:flex;
flex-direction:column;
align-items:center;
transition:transform 1.5s cubic-bezier(.22,1,.36,1);
position:relative;
}

/* LIDER */

.lider{
box-shadow:0 0 20px gold;
animation:liderPulse 2s infinite;
}

@keyframes liderPulse{
0%{box-shadow:0 0 10px gold}
50%{box-shadow:0 0 40px gold}
100%{box-shadow:0 0 10px gold}
}

/* ULTRAPASSAGEM */

.flash{
animation:flash .6s;
}

@keyframes flash{
0%{background:rgba(255,255,255,.6)}
100%{background:rgba(255,255,255,.08)}
}

.nome{
font-size:20px;
font-weight:600;
text-align:center;
color:#bfdbfe;
}

/* GRAFICO */

.areaGrafico{
margin-top:auto;
display:flex;
flex-direction:column;
align-items:center;
}

.grafico{
width:90px;
height:240px;
background:rgba(255,255,255,0.05);
border-radius:14px;
display:flex;
align-items:flex-end;
overflow:hidden;
}

.coluna{
width:100%;
height:0%;
background:linear-gradient(to top,#2563eb,#60a5fa);
transition:height 1s linear;
}

.pontos{
font-size:28px;
margin-top:16px;
color:#93c5fd;
font-weight:bold;
}

/* BOTÕES */

.controls{
text-align:center;
margin-top:40px;
}

button{
padding:14px 32px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#2563eb,#3b82f6);
color:white;
font-weight:600;
cursor:pointer;
margin:6px;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
visibility:hidden;
opacity:0;
transition:.5s;
}

.modal.show{
visibility:visible;
opacity:1;
}

.podio{
display:flex;
gap:50px;
align-items:flex-end;
}

.medalha{
width:200px;
border-radius:20px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
font-weight:bold;
color:#111;
padding:20px;
}

.score{
font-size:60px;
color:white;
text-shadow:0 4px 15px black;
margin-top:10px;
}

.ouro{
height:300px;
background:linear-gradient(145deg,#fff7a3,#ffd700,#b89600);
}

.prata{
height:250px;
background:linear-gradient(145deg,#ffffff,#cfcfcf,#8f8f8f);
}

.bronze{
height:220px;
background:linear-gradient(145deg,#ffd7a3,#cd7f32,#7a4b15);
}

.close{
position:absolute;
top:25px;
right:40px;
font-size:32px;
cursor:pointer;
color:white;
}

/* RESPONSIVO */

@media(max-width:1200px){

body{
height:auto;
justify-content:flex-start;
}

.container{
grid-template-columns:repeat(4,1fr);
}

}

@media(max-width:700px){

.container{
grid-template-columns:repeat(2,1fr);
}

}

</style>
</head>

<body>

<div class="container" id="placar"></div>

<div class="controls">
<button onclick="iniciar()">Revelar Pontuação</button>
<button onclick="mostrarPodio()">Mostrar Pódio</button>
</div>

<div class="modal" id="modal">

<div class="close" onclick="fechar()">✖</div>

<div class="podio" id="podio"></div>

</div>

<audio id="cheer" src="https://actions.google.com/sounds/v1/crowds/large_crowd_cheer.ogg"></audio>
<audio id="whoosh" src="https://actions.google.com/sounds/v1/whoosh/whoosh.ogg"></audio>
<audio id="drum" loop src="https://actions.google.com/sounds/v1/ambiences/drum_roll.ogg"></audio>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const equipes=[
["Equipe Samuel",30],
["Equipe Azul",22],
["Equipe Verde",15],
["Equipe Vermelha",27],
["Equipe Amarela",12],
["Equipe Roxa",18],
["Equipe Laranja",9],
["Equipe Preta",6]
]

const container=document.getElementById("placar")

let estado=[]
let ultimoLider=null

/* CRIAR CARDS */

equipes.forEach((e,i)=>{

estado.push({nome:e[0],final:e[1],atual:0,id:i})

const card=document.createElement("div")
card.className="card"
card.id="card"+i

card.innerHTML=`

<div class="nome">${e[0]}</div>

<div class="areaGrafico">

<div class="grafico">
<div class="coluna" id="coluna${i}"></div>
</div>

<div class="pontos">
<span id="valor${i}">0</span>
</div>

</div>
`

container.appendChild(card)

})

/* ORDENAR COM FLIP */

function ordenar(){

const cards=document.querySelectorAll(".card")

const pos={}

cards.forEach(c=>{
pos[c.id]=c.getBoundingClientRect()
})

estado.sort((a,b)=>b.atual-a.atual)

estado.forEach((e,i)=>{
document.getElementById("card"+e.id).style.order=i
})

requestAnimationFrame(()=>{

cards.forEach(card=>{

const old=pos[card.id]
const newPos=card.getBoundingClientRect()

const dx=old.left-newPos.left
const dy=old.top-newPos.top

card.style.transform=`translate(${dx}px,${dy}px)`
card.style.transition="transform 0s"

requestAnimationFrame(()=>{
card.style.transform=""
card.style.transition="transform 1.5s cubic-bezier(.22,1,.36,1)"
})

})

})

/* líder */

document.querySelectorAll(".card").forEach(c=>c.classList.remove("lider"))

const lider=estado[0]

document.getElementById("card"+lider.id).classList.add("lider")

if(ultimoLider!==lider.id){

document.getElementById("whoosh").play()

document.getElementById("card"+lider.id).classList.add("flash")

setTimeout(()=>{
document.getElementById("card"+lider.id).classList.remove("flash")
},600)

}

ultimoLider=lider.id

}

/* ANIMAÇÃO */

function iniciar(){

document.getElementById("drum").play()

const maior=Math.max(...equipes.map(e=>e[1]))

const duracao=60000
const intervalo=500

const passos=duracao/intervalo

let contador=0

const loop=setInterval(()=>{

contador++

estado.forEach(e=>{

if(e.atual>=e.final)return

let passo=Math.floor(Math.random()*2)+1

e.atual+=passo

if(e.atual>e.final)e.atual=e.final

document.getElementById("valor"+e.id).innerText=e.atual

let altura=(e.atual/maior)*100

document.getElementById("coluna"+e.id).style.height=altura+"%"

})

ordenar()

if(contador>=passos){

clearInterval(loop)

document.getElementById("drum").pause()

setTimeout(()=>mostrarPodio(),4000)

}

},intervalo)

}

/* PODIO */

function mostrarPodio(){

const top=[...estado].sort((a,b)=>b.final-a.final).slice(0,3)

const podio=document.getElementById("podio")

podio.innerHTML=`

<div class="medalha prata">

${top[1].nome}

<div class="score">${top[1].final}</div>

</div>

<div class="medalha ouro">

${top[0].nome}

<div class="score">${top[0].final}</div>

</div>

<div class="medalha bronze">

${top[2].nome}

<div class="score">${top[2].final}</div>

</div>
`

document.getElementById("modal").classList.add("show")

document.getElementById("cheer").play()

confetti({
particleCount:300,
spread:180
})

}

function fechar(){
document.getElementById("modal").classList.remove("show")
}

</script>

</body>
</html>
