<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Jogo das Plantas</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#1b5e20,#2e7d32);
color:white;
text-align:center;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
padding:30px;
}

h1{
margin-bottom:30px;
font-size:34px;
letter-spacing:1px;
}

/* PLANTAS */

#plantas{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
width:100%;
/* max-width:1200px; */
}

/* DESKTOP: UMA LINHA */

@media(min-width:800px){

body{
padding-top: 20vh;
}

#plantas{
flex-wrap:nowrap;
/* gap:35px; */
}

.planta{
width:260px;
padding:20px;
}

.planta img{
height:240px;
}

.drop{
height:65px;
font-size:18px;
}

.nome{
font-size:18px;
padding:12px 18px;
}

button{
font-size:30px;
padding:16px 50px;
}

#resultado{
font-size:90px;
}

}

.planta{
background:#ffffff10;
backdrop-filter:blur(8px);
border-radius:16px;
padding:15px;
width:180px;
box-shadow:0 8px 25px rgba(0,0,0,0.25);
transition:transform .2s;
}

.planta:hover{
transform:translateY(-5px);
}

.planta img{
width:100%;
height:160px;
object-fit:cover;
border-radius:12px;
}

/* DROP */

.drop{
margin-top:12px;
height:50px;
border:2px dashed #c8e6c9;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
background:#00000020;
}

/* NOMES */

#nomes{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:12px;
margin-top:35px;
max-width:1000px;
}

.nome{
background:#66bb6a;
padding:10px 16px;
border-radius:12px;
cursor:grab;
font-weight:bold;
box-shadow:0 4px 10px rgba(0,0,0,0.3);
transition:.2s;
}

.nome:hover{
transform:scale(1.05);
background:#81c784;
}

/* BOTAO */

button{
margin-top:35px;
font-size:26px;
padding:14px 40px;
border:none;
border-radius:14px;
background:#00e676;
color:#004d40;
font-weight:bold;
cursor:pointer;
box-shadow:0 6px 18px rgba(0,0,0,0.35);
transition:.2s;
}

button:hover{
transform:scale(1.05);
}

/* RESULTADO */

#resultado{
font-size:70px;
margin-top:30px;
font-weight:bold;
text-shadow:0 4px 15px rgba(0,0,0,0.4);
}

/* CONFETE */

canvas{
position:fixed;
pointer-events:none;
top:0;
left:0;
}

</style>
</head>

<body>

<h1>Acerte o Nome das Plantas 🌿</h1>

<div id="plantas"></div>

<div id="nomes"></div>

<button onclick="verificar()">VERIFICAR</button>

<div id="resultado"></div>

<canvas id="confete"></canvas>

<script>

const bancoPlantas=[
{nome:"Clorofito",img:"assets/Plantas/Clorofito.jpg"},
{nome:"Calathea",img:"assets/Plantas/Calathea.jpg"},
{nome:"Zamioculca",img:"assets/Plantas/Zamioculca.jpg"},
{nome:"Dinheiro-em-penca",img:"assets/Plantas/Dinheiro-em-penca.jpg"},
{nome:"Begonia",img:"assets/Plantas/Begonia.jpg"},
{nome:"Violeta",img:"assets/Plantas/Violeta.jpg"},
{nome:"Maranta_Pavão",img:"assets/Plantas/Maranta_Pavão.jpg"},
{nome:"Peperomia",img:"assets/Plantas/Peperomia.jpg"},
{nome:"Anturio",img:"assets/Plantas/Anturio.jpg"},
{nome:"Lírio-da-paz",img:"assets/Plantas/Lírio-da-paz.jpg"},
{nome:"Crossandra",img:"assets/Plantas/Crossandra.jpg"}
]

function embaralhar(arr){
return [...arr].sort(()=>Math.random()-0.5)
}

const plantasEscolhidas=embaralhar(bancoPlantas)

const plantasDiv=document.getElementById("plantas")

plantasEscolhidas.forEach(p=>{
plantasDiv.innerHTML+=`
<div class="planta">
<img src="${p.img}">
<div class="drop" data-correto="${p.nome}"></div>
</div>
`
})

const nomes=embaralhar(plantasEscolhidas.map(p=>p.nome))

const nomesDiv=document.getElementById("nomes")

nomes.forEach(n=>{
nomesDiv.innerHTML+=`
<div class="nome" draggable="true" id="${n}">
${n}
</div>
`
})

/* DRAG */

document.querySelectorAll(".nome").forEach(n=>{
n.addEventListener("dragstart",drag)
})

document.querySelectorAll(".drop").forEach(d=>{
d.addEventListener("dragover",e=>e.preventDefault())
d.addEventListener("drop",drop)
})

function drag(ev){
ev.dataTransfer.setData("text",ev.target.id)
}

function drop(ev){

ev.preventDefault()

const id=ev.dataTransfer.getData("text")
const arrastado=document.getElementById(id)

const alvo=ev.currentTarget

/* SE O DROP JÁ TEM NOME */

if(alvo.firstChild){

const existente=alvo.firstChild

const origem=arrastado.parentElement

origem.appendChild(existente)

}

alvo.appendChild(arrastado)

}

/* VERIFICAR */

function verificar(){

let acertos=0

document.querySelectorAll(".drop").forEach(d=>{

if(d.firstChild){

let nome=d.firstChild.id
let correto=d.dataset.correto

if(nome===correto){
acertos++
}

}

})

document.getElementById("resultado").innerText=acertos+" ACERTOS"

if(acertos===plantasEscolhidas.length){
confete()
}

}

/* CONFETE */

function confete(){

const canvas=document.getElementById("confete")
const ctx=canvas.getContext("2d")

canvas.width=window.innerWidth
canvas.height=window.innerHeight

let pieces=[]

for(let i=0;i<200;i++){
pieces.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height-canvas.height,
size:6+Math.random()*6,
speed:2+Math.random()*3
})
}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height)

pieces.forEach(p=>{

ctx.fillStyle="hsl("+Math.random()*360+",80%,60%)"
ctx.fillRect(p.x,p.y,p.size,p.size)

p.y+=p.speed

})

requestAnimationFrame(draw)

}

draw()

}

</script>

</body>
</html>
