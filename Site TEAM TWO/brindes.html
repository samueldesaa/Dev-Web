<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brindes Team Two</title>
  <link rel="shortcut icon" href="Team Two.png" type="image/x-icon">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: 'Poppins', sans-serif;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem 2rem;
    }

    .container {
      background: #fff;
      max-width: 900px;
      width: 100%;
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      padding-bottom: 6rem;
    }

    .btn-back {
      position: absolute;
      top: 1em;
      left: 1em;
      z-index: 999;
      background-color: #764ba2;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(118,75,162,0.5);
      transition: background-color 0.3s ease;
    }

    .btn-back:hover,
    .btn-back:focus {
      background-color: #5a3580;
      outline: none;
    }

    .qr-group {
      display: flex;
      gap: 3rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 700px;
    }

    .qr-container {
      background: #f5f5f5;
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 0 14px 40px rgba(118,75,162,0.5);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 270px;
      min-height: 350px;
    }
    .qr-container:hover{
        transform: scale(1.1);
    }

    .qr-container h2 {
      color: #764ba2;
      margin-bottom: 1rem;
      text-align: center;
    }

    .carousel img {
      width: 200px;
      height: 200px;
      border-radius: 16px;
      filter: drop-shadow(0 0 8px #764ba2);
      object-fit: contain;
    }

    .qr-label {
      margin-top: 1.2rem;
      font-weight: 700;
      color: #764ba2;
      font-size: 1.15rem;
      user-select: none;
      text-align: center;
    }

    .btn-brindes {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      background-color: #764ba2;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 1.2rem 3rem;
      font-size: 1.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(118,75,162,0.6);
      transition: background-color 0.3s ease;
      z-index: 1000;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    .btn-brindes:hover,
    .btn-brindes:focus {
      background-color: #5a3580;
      outline: none;
    }

    @media (max-width: 700px) {
      body {
        padding: 1.5rem 1rem;
      }

      .container {
        padding: 1.5rem 1rem 5rem;
      }

      .qr-group {
        flex-direction: column;
        gap: 2rem;
      }

      .qr-container {
        width: 100%;
        max-width: 250px;
        padding: 1.5rem;
      }

      .btn-brindes {
        font-size: 1.4rem;
        padding: 1rem 2rem;
      }
    }
  </style>
</head>
<body>

  <button class="btn-back" onclick="window.location.href='vaquinha.html'">← Voltar</button>

  <div class="container">
    <h1>🎁 Lista de Brindes</h1>
    <h2>Clique nos brindes que deseja sortear</h2>

    <div class="qr-group">
      <div class="qr-container" onclick="window.location.href='roleta5reais.html'">
        <h2>Brindes de 5 Reais</h2>
        <div id="carousel-5" class="carousel"></div>
      </div>

      <div class="qr-container" onclick="window.location.href='roleta10reais.html'">
        <h2>Brindes de 10 Reais</h2>
        <div id="carousel-10" class="carousel"></div>
      </div>
    </div>
  </div>

  <!-- Importa os dados -->
  <script src="listarImagens.js"></script>

  <!-- Carrosséis -->
  <script>
    function criarCarrossel(containerId, lista) {
      const container = document.getElementById(containerId);
      let index = 0;

      function renderItem() {
        const item = lista[index];
        container.innerHTML = `
          <img src="${item.imagem}" alt="${item.nome}" />
          <div class="qr-label">${item.nome}</div>
        `;
      }

      renderItem();
      setInterval(() => {
        index = (index + 1) % lista.length;
        renderItem();
      }, 2000);
    }

    criarCarrossel('carousel-5', items5);
    criarCarrossel('carousel-10', items10);
  </script>

</body>
</html>
