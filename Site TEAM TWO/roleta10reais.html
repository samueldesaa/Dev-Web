<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <title>Roleta Brindes</title>
  <link rel="shortcut icon" href="Team Two.png" type="image/x-icon">
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      margin: 0;
      padding: 30px 0 0 0;
    }

    canvas#wheel {
      background: rgb(255, 255, 255);
      filter: drop-shadow(0 0 10px cyan);
      border: 8px solid #888;
      border-radius: 50%;
      margin-top: 20px;
      width: 90vw;
      max-width: 600px;
      height: auto;
      aspect-ratio: 1 / 1;
    }

    .wheel-container {
  position: relative;
  display: inline-block;
}

#spinBtn {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background-color: #27ae60;
  color: white;
  font-size: 1.2rem;
  font-weight: bold;
  border: none;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.4);
  transition: background-color 0.3s ease;
}

#spinBtn:hover {
  background-color: #219150;
}


    #modal {
      display: none;
      position: fixed;
      z-index: 999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items10: center;
      padding: 1rem;
    }

    #modalContent {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 90%;
      width: 400px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
      animation: popIn 0.4s ease-out;
    }

    @keyframes popIn {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    #modal img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    h1 {
      color: white;
      font-size: 3vw;
      margin-bottom: 10px;
      max-font-size: 32px;
    }

    #confetti {
      position: fixed;
      pointer-events: none;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
    }

    #backBtn {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background-color: #764ba2;
      color: #fff;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(118, 75, 162, 0.5);
      transition: background-color 0.3s ease;
    }

    /* Responsividade */
    @media (max-width: 600px) {


      #modalContent {
        padding: 20px;
      }

      h1 {
        font-size: 7vw;
      }

      #backBtn {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
      }
    }
  </style>

</head>

<body>
  <h1>🎯Ganhe seu brinde</h1>
  <div class="wheel-container">
    <canvas id="wheel" width="500" height="500"></canvas>
    <button id="spinBtn">⟳</button>
  </div>
  
  <button id="backBtn" onclick="location.href='brindes.html'">← Voltar</button>

  <!-- Modal de resultado -->
  <div id="modal">
    <div id="modalContent">
      <h2>🎉 Parabéns!</h2>
      <img id="resultImg" src="" alt="Item">
      <p>Você ganhou: <strong id="resultName"></strong></p>
    </div>
  </div>

  <!-- Confetti canvas -->
  <canvas id="confetti"></canvas>

  <!-- Sons -->
  <audio id="spinSound" src="Roda1.mp3" loop></audio>
  <audio id="yaySound" src="Yay.mp3"></audio>

  <script src="listarImagens.js"></script>
  <script>
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 230;

    let loadedImages = 0;
    items10.forEach(item => {
      const img = new Image();
      img.src = item.imagem;
      img.onload = () => {
        loadedImages++;
        if (loadedImages === items10.length) {
          drawWheel();
        }
      };
      item.imgObj = img;
    });

    let rotation = 0;
    let isSpinning = false;

    // Sons
    const spinSound = document.getElementById("spinSound");
    const yaySound = document.getElementById("yaySound");

    // Gera uma cor aleatória em formato hexadecimal
    function getRandomPastelColor() {
      function randomPastelValue() {
        return Math.floor((Math.random() * 105) + 150); // 150 a 255
      }

      const r = randomPastelValue();
      const g = randomPastelValue();
      const b = randomPastelValue();

      const toHex = (value) => value.toString(16).padStart(2, '0');

      return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
    }

    const colors = items10.map(() => getRandomPastelColor());

    function drawWheel() {
      const sliceAngle = (2 * Math.PI) / items10.length;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const baseCount = 6;
      const baseSize = 90;
      const minSize = 40;
      const baseDistanceFactor = 0.8;
      const minDistanceFactor = 0.65;

      const scaleFactor = Math.sqrt(baseCount / items10.length);

      const size = Math.max(minSize, baseSize * scaleFactor);
      const distanceFactor = Math.max(minDistanceFactor, baseDistanceFactor * scaleFactor);

      for (let i = 0; i < items10.length; i++) {
        const item = items10[i];
        const startAngle = i * sliceAngle + rotation;
        const endAngle = startAngle + sliceAngle;

        ctx.fillStyle = colors[i];
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fill();

        const angle = startAngle + sliceAngle / 2;
        const imgX = centerX + Math.cos(angle) * radius * distanceFactor;
        const imgY = centerY + Math.sin(angle) * radius * distanceFactor;

        ctx.save();
        ctx.translate(imgX, imgY);
        ctx.rotate(0);
        ctx.drawImage(item.imgObj, -size / 2, -size / 2, size, size);
        ctx.restore();
      }

      ctx.fillStyle = "#706c00";
      ctx.beginPath();
      ctx.moveTo(centerX, centerY - radius + 10);
      ctx.lineTo(centerX - 10, centerY - radius - 30);
      ctx.lineTo(centerX + 10, centerY - radius - 30);
      ctx.closePath();
      ctx.fill();
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;

      // Começa som da roleta
      spinSound.currentTime = 0;
      spinSound.play();

      const duration = 12000; // 10 segundos
      const minRotations = 8;
      const maxRotations = 15;
      const totalRotationDegrees = (Math.random() * (maxRotations - minRotations) + minRotations) * 360;

      const start = performance.now();

      function animate(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const eased = easeOutCubic(progress);
        rotation = (totalRotationDegrees * eased) * Math.PI / 180;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;

          // Para o som da roleta e toca o yay
          spinSound.pause();
          spinSound.currentTime = 0;

          yaySound.currentTime = 0;
          yaySound.play();

          showResult();
        }
      }

      requestAnimationFrame(animate);
    }

    function showResult() {
      const sliceAngle = (2 * Math.PI) / items10.length;

      const normalizedRotation = rotation % (2 * Math.PI);

      const pointerAngle = (3 * Math.PI / 2 - normalizedRotation + 2 * Math.PI) % (2 * Math.PI);

      const selectedIndex = Math.floor(pointerAngle / sliceAngle) % items10.length;

      const selected = items10[selectedIndex];

      document.getElementById("resultName").textContent = selected.nome;
      document.getElementById("resultImg").src = selected.imagem;
      document.getElementById("modal").style.display = "flex";

      launchConfetti();
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    document.getElementById("spinBtn").addEventListener("click", spinWheel);

    document.getElementById("modal").addEventListener("click", () => {
      document.getElementById("modal").style.display = "none";
    });

    const confettiCanvas = document.getElementById("confetti");
    const confettiCtx = confettiCanvas.getContext("2d");
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;

    let confettiParticles = [];

    function launchConfetti() {
      confettiParticles = [];

      const colors = ["#FFC700", "#FF0000", "#2E3192", "#41BBC7"];

      for (let i = 0; i < 150; i++) {
        confettiParticles.push({
          x: Math.random() * confettiCanvas.width,
          y: Math.random() * confettiCanvas.height - confettiCanvas.height,
          r: (Math.random() * 6) + 4,
          d: (Math.random() * 15) + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngleIncremental: (Math.random() * 0.07) + 0.05,
          tiltAngle: 0
        });
      }

      requestAnimationFrame(updateConfetti);
      setTimeout(() => {
        confettiParticles = [];
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      }, 5000);
    }

    function updateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      for (let i = 0; i < confettiParticles.length; i++) {
        const p = confettiParticles[i];
        p.tiltAngle += p.tiltAngleIncremental;
        p.y += (Math.cos(p.d) + 3 + p.r / 2) / 2;
        p.x += Math.sin(p.d);
        p.tilt = Math.sin(p.tiltAngle) * 15;

        confettiCtx.beginPath();
        confettiCtx.lineWidth = p.r / 2;
        confettiCtx.strokeStyle = p.color;
        confettiCtx.moveTo(p.x + p.tilt + (p.r / 4), p.y);
        confettiCtx.lineTo(p.x + p.tilt, p.y + p.tilt + (p.r / 4));
        confettiCtx.stroke();

        if (p.y > confettiCanvas.height) {
          p.x = Math.random() * confettiCanvas.width;
          p.y = -10;
        }
      }
      if (confettiParticles.length > 0) {
        requestAnimationFrame(updateConfetti);
      }
    }
  </script>
</body>

</html>
